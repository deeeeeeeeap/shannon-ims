<!doctype html>
<!-- lang is zh-CN because the interface text is Simplified Chinese. It said "en",
     which makes a screen reader read every Chinese label with English phonetics. -->
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoHive</title>
  <!-- Inter is bundled and self-hosted; see the @font-face in src/style.css for
       why this console does not fetch a remote webfont. -->
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // Runs before first paint so the theme applies without a flash. An unset
    // preference now follows the OS instead of always meaning light, which used to
    // give dark-mode users a bright page on first visit.
    try {
      var stored = localStorage.getItem('theme')
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle('dark', stored === 'dark' || (stored !== 'light' && prefersDark))
    } catch { }
  </script>
  <style>
    :root {
      color-scheme: light dark;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #f9fafb;
    }

    html.dark body {
      background: #101014;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
